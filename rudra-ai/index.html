<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RUDRA AI — The storm that writes code." />
    <script>
      // Apply the persisted theme before first paint (no flash). Mirrors rudra.theme in ui.store.
      try {
        if (localStorage.getItem("rudra.theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {
        /* storage unavailable — stay dark */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>RUDRA AI — The storm that writes code</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
